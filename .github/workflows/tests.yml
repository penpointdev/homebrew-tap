name: Tests

# Lints and audits every cask in the tap. Cask bump PRs from the PeepMD release
# script must pass this before they are merged by hand.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  casks:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      # Checks out this commit as the tap and trusts it.
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: brew style
        env:
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew style "$TAP"

      - name: brew audit
        env:
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew audit --cask --strict --online --tap "$TAP"
